name: Build Windows EXE

on:
  workflow_dispatch:  # 手動觸發

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: pip install -r requirements.txt

      - name: 打包成 EXE
        run: |
          pyinstaller --onefile --windowed --name "批次配對與編號生成工具" main.py

      - name: 上傳 EXE 成品
        uses: actions/upload-artifact@v4
        with:
          name: 批次處理工具
          path: dist/批次配對與編號生成工具.exe
